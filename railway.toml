[build]
builder = "NIXPACKS"
buildCommand = "npm install --workspace=apps/api --include-workspace-root --include=dev && cd apps/api && npx prisma generate && npx nest build"

[deploy]
startCommand = "node apps/api/dist/src/main"
preDeployCommand = "npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma"
